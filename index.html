<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web Orbit Tracker - リアルタイム軌道追跡カメラ</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Web Orbit Tracker is a real-time, browser-based physical target trajectory tracing web application utilizing OpenCV.js WebAssembly. Fast, reliable, with interactive multi-mode tracking.">
    <meta name="keywords" content="Orbit Tracker, Real-time tracking, OpenCV.js, WebAssembly, Camera trajectory, Computer vision">
    
    <!-- Primary App Styling -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Race-condition guard for OpenCV.js loading -->
    <script type="text/javascript">
        window.opencvReadyTriggered = false;
        window.opencvLoadFailed = false;
        window.onOpenCvReady = function() {
            window.opencvReadyTriggered = true;
            console.log('OpenCV.js WebAssembly downloaded successfully.');
            if (typeof window.onOpenCvReadyCallback === 'function') {
                window.onOpenCvReadyCallback();
            }
        };
        window.onOpenCvError = function() {
            window.opencvLoadFailed = true;
            console.warn('OpenCV.js failed to load. Tracking disabled.');
            if (typeof window.onOpenCvFailCallback === 'function') {
                window.onOpenCvFailCallback();
            }
        };
    </script>
</head>
<body>

    <div id="app-container">
        
        <!-- Camera Viewport & Overlaid Drawings -->
        <div id="viewport-container">
            <video id="camera-video" autoplay playsinline muted></video>
            <canvas id="drawing-canvas"></canvas>
        </div>
        
        <!-- Splash Loading Screen -->
        <div id="loading-overlay">
            <h1 class="loader-logo">WEB ORBIT TRACKER</h1>
            <div class="spinner-container">
                <div class="spinner-outer"></div>
                <div class="spinner-inner"></div>
            </div>
            <p id="loading-status" class="loader-status">カメラを起動中...</p>
        </div>

        <!-- OpenCV background loading indicator (top-right badge) -->
        <div id="opencv-status-badge" style="
            display: none;
            position: absolute;
            top: 12px;
            right: 195px;
            z-index: 20;
            padding: 4px 12px;
            background: rgba(234,179,8,0.15);
            border: 1px solid rgba(234,179,8,0.4);
            border-radius: 20px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: #eab308;
            letter-spacing: 0.04rem;
            backdrop-filter: blur(8px);
            animation: pulse 1.5s ease-in-out infinite;
        ">⚙ 追尾エンジン読込中...</div>
        
        <!-- Left Panel: Real-time Stats Overlay -->
        <div id="stats-panel" class="hud-panel">
            <div class="stat-row">
                <span class="stat-label">ステータス</span>
                <span id="status-badge" class="status-badge status-none">STANDBY</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">フレームレート</span>
                <span><span id="fps-value" class="stat-value">--</span> FPS</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">軌跡要素数</span>
                <span id="trail-points-value" class="stat-value">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">ターゲット座標</span>
                <span id="target-coords-value" class="stat-value">Tap to Target</span>
            </div>
        </div>
        
        <!-- Right Panel: Round Icon Buttons -->
        <div id="controls-panel" class="hud-panel">
            <div class="icon-btn-grid">

                <!-- Record: start / stop swap in same cell -->
                <div class="icon-btn-wrapper">
                    <div class="icon-btn-swap">
                        <button id="btn-start-record" class="icon-btn icon-btn-primary" disabled>
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="12" cy="12" r="7"/></svg>
                        </button>
                        <button id="btn-stop-record" class="icon-btn icon-btn-danger" style="display:none;">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
                        </button>
                    </div>
                    <span class="icon-btn-label" id="record-btn-label">撮影開始</span>
                </div>

                <!-- Trail Reset -->
                <div class="icon-btn-wrapper">
                    <button id="btn-trail-reset" class="icon-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
                        </svg>
                    </button>
                    <span class="icon-btn-label">軌跡リセット</span>
                </div>

                <!-- Range Expand -->
                <div class="icon-btn-wrapper">
                    <button id="btn-range-expand" class="icon-btn">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <circle cx="10" cy="10" r="6"/>
                            <path d="M14.2 14.2L20 20"/>
                            <path d="M7 10h6M10 7v6"/>
                        </svg>
                    </button>
                    <span class="icon-btn-label">範囲拡大</span>
                </div>

                <!-- Range Shrink -->
                <div class="icon-btn-wrapper">
                    <button id="btn-range-shrink" class="icon-btn">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <circle cx="10" cy="10" r="6"/>
                            <path d="M14.2 14.2L20 20"/>
                            <path d="M7 10h6"/>
                        </svg>
                    </button>
                    <span class="icon-btn-label">範囲縮小</span>
                </div>

                <!-- Camera Select -->
                <div class="icon-btn-wrapper">
                    <button id="btn-camera-select" class="icon-btn">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
                            <circle cx="12" cy="13" r="4"/>
                        </svg>
                    </button>
                    <span class="icon-btn-label">カメラ切替</span>
                </div>

                <!-- Mode Toggle: color ↔ template -->
                <div class="icon-btn-wrapper">
                    <button id="btn-mode-toggle" class="icon-btn">
                        <!-- Icon swapped by JS -->
                        <svg id="mode-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <circle cx="12" cy="12" r="7"/>
                            <circle cx="12" cy="12" r="3.5" fill="white" opacity="0.55"/>
                        </svg>
                    </button>
                    <span class="icon-btn-label" id="mode-btn-label">カラー追尾</span>
                </div>

            </div>

            <!-- Camera picker popup (appears to the left of panel) -->
            <div id="camera-picker"></div>
        </div>
        
        <!-- Orientation Enforced Warning Alert (Landscape Lock) -->
        <div id="orientation-overlay">
            <svg class="device-rotate-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="25" y="10" width="50" height="80" rx="6" stroke="#94a3b8" stroke-width="4" />
                <circle cx="50" cy="82" r="3" fill="#94a3b8" />
                <path d="M40 30 C 20 40, 20 60, 40 70" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none" />
                <path d="M40 70 L 32 68 M 40 70 L 38 60" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
                <path d="M60 30 C 80 40, 80 60, 60 70" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none" />
                <path d="M60 30 L 68 32 M 60 30 L 62 40" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
            </svg>
            <h2 class="orientation-title">画面を横向きにしてください</h2>
            <p class="orientation-desc">本アプリは横画面（ランドスケープ）での使用に最適化されています。デバイスを回転させてご使用ください。</p>
        </div>

    </div>

    <!-- Core App Logic & WebAssembly Tracing Core -->
    <script src="js/tracker.js" type="text/javascript"></script>
    <script src="js/app.js" type="text/javascript"></script>
    
    <!-- OpenCV.js WebAssembly Library (correct version from jsDelivr) -->
    <script async
        src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.min.js"
        onload="onOpenCvReady();"
        onerror="onOpenCvError();"
        type="text/javascript"></script>
</body>
</html>
